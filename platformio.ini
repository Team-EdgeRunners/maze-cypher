; PlatformIO Configuration File for STM32 Maze-Cypher Robot
;
; Select active test environment in PlatformIO Status Bar or platformio.ini
; Board: Default is STM32F103C8T6 Blue Pill (bluepill_f103c8).
; Change 'board' parameter if using Nucleo, BlackPill, or custom STM32 board.


; Upload Configuration:
; - ST-Link V2 Programmer: upload_protocol = stlink (SWDIO=PA13, SWCLK=PA14, GND, 3.3V)
; - USB-to-TTL Adapter:    upload_protocol = serial
;   [USB-TTL Wiring]:
;     TX (Adapter)  -> PA10 (STM32 RX1)
;     RX (Adapter)  -> PA9  (STM32 TX1)
;     GND (Adapter) -> GND  (STM32)
;     3V3/5V        -> 3V3/5V
;   [Bootloader Jumper Step]:
;     1. Set BOOT0 jumper to 1 (HIGH) and press Reset button before clicking Upload.
;     2. After upload finishes, set BOOT0 back to 0 (LOW) and press Reset.

[platformio]
default_envs = vl53l0x_test

[env]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = serial
upload_port = COM17 ;update this to your USB-TTL adapter COM port
build_flags =
    -D SERIAL_UART_INSTANCE=1
    -Wno-deprecated-declarations

; --- Environment 1: VL53L0XV2 TOF Distance Sensor ---
[env:vl53l0x_test]
build_src_filter = +<../Test/VL53L0X/>
lib_deps = 
    adafruit/Adafruit_VL53L0X @ ^1.2.4

; --- Environment 2: BMI160 6-Axis IMU (Gyro + Accelerometer) ---
[env:bmi160_test]
build_src_filter = +<../Test/BMI160/>
lib_deps = 
    mncc8337/BMI160-Arduino-Extended @ ^1.0.1

; --- Environment 3: 0.96" 128x64 Yellow & Blue SPI OLED Display ---
[env:oled_spi_test]
build_src_filter = +<../Test/OLED_SPI/>
lib_deps = 
    adafruit/Adafruit GFX Library @ ^1.11.5
    adafruit/Adafruit SSD1306 @ ^2.5.7

; --- Environment 4: L298N Dual Motor Driver + 2x N20 Hall Encoders ---
[env:l298n_motors_test]
build_src_filter = +<../Test/L298N_Motors/>

; --- Environment 5: I2C Address Scanner Utility ---
[env:i2c_scanner]
build_src_filter = +<../Test/I2C_Scanner/>

; --- Environment 6: STM32 Blue Pill Blink Test ---
[env:bluepill_blink]
build_src_filter = +<../Test/BLUEPILL_TEST/>

; --- Environment 7: Combined I2C Bus Scanner & VL53L0X TOF Sensor Test ---
[env:i2c_vl53l0x_test]
build_src_filter = +<../Test/I2C_Scanner_VL53L0X/>
lib_deps = 
    adafruit/Adafruit_VL53L0X @ ^1.2.4

